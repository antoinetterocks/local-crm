name: build

# Artology CRM native builds. The app code comes from the artology submodule,
# pinned to the commit recorded in this repo.
#
# artology is private, so checking out the submodule needs a token that can
# read it: a fine-grained personal access token with Contents: read on
# antoinetterocks/artology ONLY, saved as the repository secret
# ARTOLOGY_READ_TOKEN. Until it exists the build jobs are skipped (not red).
# Checkout never persists the token in the workspace.
#
# Built files (web bundle, APK, installers) are uploaded as workflow
# artifacts only while this repository is private — anyone can download the
# artifacts of a public repository.
#
# - every PR / push: web build + Android debug APK;
# - macOS (.dmg) + Windows (.msi / .exe) when run by hand or on a v* tag.
# iOS is archived and uploaded from Xcode (it needs the Apple signing identity).

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.ARTOLOGY_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ARTOLOGY_READ_TOKEN is not set, so the artology submodule can't be checked out. Builds skipped."
          fi

  web-and-android:
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ARTOLOGY_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run web:build
      - if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: crm-web
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx cap sync android
      - name: Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: crm-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  desktop:
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ARTOLOGY_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Unsigned unless the Apple signing secrets are set (see README).
      - uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
      - if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: crm-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
